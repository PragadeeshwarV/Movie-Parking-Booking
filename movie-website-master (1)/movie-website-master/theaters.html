<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Theater</title>
    <style>
        /* Background styling */
        body {
            font-family: Arial, sans-serif;
            background: url('back.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Container styling */
        .theater-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            width: 300px;
            display: none; /* Initially hidden */
        }

        /* Title */
        h2 {
            color: white;
            margin-bottom: 15px;
        }

        /* Theater buttons */
        .theater-button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: rgba(255, 0, 0, 0.8);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.4s ease;
        }

        /* Hover slide effect */
        .theater-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: 0.4s ease;
        }

        .theater-button:hover::before {
            left: 0;
        }

        .theater-button:hover {
            background-color: rgba(255, 0, 0, 1);
            transform: translateY(-3px);
        }

        /* Header styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            padding: 10px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .header-title {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        .header-button {
            background-color: white;
            border: 1px solid #ccc;
            padding: 5px 10px;
            margin-left: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .header-button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">CINEMAKANNIS</div>
        <div>
            <button class="header-button" onclick="showTheaterContainer()">Home</button>
            <button class="header-button" onclick="showTheaterContainer()">Movies</button>
            <button class="header-button" onclick="showTheaterContainer()">Theaters</button>
        </div>
    </div>

    <div class="theater-container" id="theater-container">
        <h2>Select a Theater</h2>
        <button class="theater-button" onclick="selectTheater('PVR Cinemas')">PVR Cinemas</button>
        <button class="theater-button" onclick="selectTheater('INOX')">INOX</button>
        <button class="theater-button" onclick="selectTheater('Sathyam Cinemas')">Sathyam Cinemas</button>
        <button class="theater-button" onclick="selectTheater('SPI Cinemas')">SPI Cinemas</button>
        <button class="theater-button" onclick="selectTheater('Cinepolis')">Cinepolis</button>
    </div>

    <script>
        function showTheaterContainer() {
            document.getElementById('theater-container').style.display = 'block';
        }

        function selectTheater(theaterName) {
            alert("You selected: " + theaterName);
            // You can redirect to another page or store the selection
        }
    </script>

</body>
</html>
